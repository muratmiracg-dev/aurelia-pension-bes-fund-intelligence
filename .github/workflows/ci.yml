name: Verify analytics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m aurelia_pension validate --json
      # Tests must run against the COMMITTED artifacts: test_artifacts.py compares them
      # with a fresh build in a temp dir, and test_engine.cjs reads dashboard_data.json.
      # Building in the checkout first would overwrite artifacts/ and data/demo/ and
      # make the stale-artifact guard compare a fresh build with itself.
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_engine.cjs
      - run: python -m aurelia_pension build
      - run: python -m compileall -q src
