[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelia-pension"
version = "1.0.0"
description = "Reproducible BES fund performance, portfolio risk and contribution analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Murat Miraç Gedik"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4"]

[project.scripts]
aurelia-pension = "aurelia_pension.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
